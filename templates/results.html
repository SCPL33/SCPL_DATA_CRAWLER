<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Results - Universal Scraper</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-9">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="h3">Crawl complete</h1>
              <p class="text-muted">Run ID: {{ run_id }}</p>

              <div class="row g-3">
                <div class="col-md-4">
                  <div class="border rounded p-3 bg-white">
                    <div class="fw-bold">URLs crawled</div>
                    <div class="display-6">{{ total }}</div>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="border rounded p-3 bg-white">
                    <div class="fw-bold">Batch size</div>
                    <div class="display-6">{{ batch_size }}</div>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="border rounded p-3 bg-white">
                    <div class="fw-bold">Batches</div>
                    <div class="display-6">{{ batch_count }}</div>
                  </div>
                </div>
              </div>

              <hr class="my-4" />
              <h2 class="h5">Batch JSON outputs</h2>
              <ul class="list-group">
                {% for file in result_files %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                  {{ file }}
                  <a class="btn btn-sm btn-outline-primary" href="{{ url_for('download_result', filename=file) }}">
                    Download
                  </a>
                </li>
                {% endfor %}
              </ul>

              <div class="mt-4">
                <a class="btn btn-link" href="{{ url_for('index') }}">Start a new upload</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
